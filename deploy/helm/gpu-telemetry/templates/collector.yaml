apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.replicaCount.collector }}
  selector:
    matchLabels:
      app.kubernetes.io/component: collector
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: collector
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "gpu-telemetry.podSecurity" . | nindent 6 }}
      initContainers:
        - name: wait-gateway
          image: {{ include "gpu-telemetry.image" (dict "root" . "service" "collector") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - until wget -qO- "http://{{ .Release.Name }}-gateway:{{ .Values.gateway.port }}/healthz"; do sleep 2; done
      containers:
        - name: collector
          image: {{ include "gpu-telemetry.image" (dict "root" . "service" "collector") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gpu-telemetry.containerSecurity" . | nindent 10 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MQ_ADDR
              value: "{{ .Release.Name }}-broker:{{ .Values.broker.port }}"
            - name: MQ_TOPIC
              value: {{ .Values.topic | quote }}
            - name: MQ_GROUP
              value: {{ .Values.group | quote }}
            - name: GATEWAY_URL
              value: "http://{{ .Release.Name }}-gateway:{{ .Values.gateway.port }}"
            - name: CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: METRICS_ADDR
              value: ":{{ .Values.collector.metricsPort }}"
          ports:
            - containerPort: {{ .Values.collector.metricsPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    app.kubernetes.io/component: collector
    {{- include "gpu-telemetry.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.collector.metricsPort }}
      targetPort: http
      name: http
