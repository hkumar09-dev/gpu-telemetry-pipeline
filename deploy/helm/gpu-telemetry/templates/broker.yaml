apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-broker
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.replicaCount.broker }}
  selector:
    matchLabels:
      app.kubernetes.io/component: broker
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: broker
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "gpu-telemetry.podSecurity" . | nindent 6 }}
      containers:
        - name: broker
          image: {{ include "gpu-telemetry.image" (dict "root" . "service" "broker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gpu-telemetry.containerSecurity" . | nindent 10 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MQ_ADDR
              value: ":{{ .Values.broker.port }}"
            - name: MQ_PARTITIONS
              value: "{{ .Values.broker.partitions }}"
            - name: MQ_MAX_QUEUE_SIZE
              value: "{{ .Values.broker.maxQueueSize }}"
            - name: MQ_ACK_TIMEOUT
              value: {{ .Values.broker.ackTimeout | quote }}
            - name: MQ_RETRY_LIMIT
              value: "{{ .Values.broker.retryLimit }}"
            - name: MQ_RETRY_BACKOFF
              value: {{ .Values.broker.retryBackoff | quote }}
            - name: MQ_RETRY_QUEUE_SIZE
              value: "{{ .Values.broker.retryQueueSize }}"
            - name: METRICS_ADDR
              value: ":{{ .Values.broker.metricsPort }}"
          ports:
            - containerPort: {{ .Values.broker.port }}
              name: mq
            - containerPort: {{ .Values.broker.metricsPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-broker
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  selector:
    app.kubernetes.io/component: broker
    {{- include "gpu-telemetry.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.broker.port }}
      targetPort: mq
      name: mq
    - port: {{ .Values.broker.metricsPort }}
      targetPort: http
      name: http
