apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-streamer
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamer
spec:
  serviceName: {{ .Release.Name }}-streamer
  replicas: {{ .Values.replicaCount.streamer }}
  selector:
    matchLabels:
      app.kubernetes.io/component: streamer
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: streamer
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "gpu-telemetry.podSecurity" . | nindent 6 }}
      containers:
        - name: streamer
          image: {{ include "gpu-telemetry.image" (dict "root" . "service" "streamer") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gpu-telemetry.containerSecurity" . | nindent 10 }}
          env:
            - name: MQ_ADDR
              value: "{{ .Release.Name }}-broker:{{ .Values.broker.port }}"
            - name: MQ_TOPIC
              value: {{ .Values.topic | quote }}
            - name: CSV_PATH
              value: {{ .Values.streamer.csvPath | quote }}
            - name: STREAMER_COUNT
              value: "{{ .Values.replicaCount.streamer }}"
            - name: STREAM_INTERVAL
              value: {{ .Values.streamer.interval | quote }}
            - name: STREAM_LOOP
              value: "{{ .Values.streamer.loop }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-streamer
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: streamer
    {{- include "gpu-telemetry.selectorLabels" . | nindent 4 }}
