apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      {{- include "gpu-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "gpu-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "gpu-telemetry.podSecurity" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "gpu-telemetry.image" (dict "root" . "service" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "gpu-telemetry.containerSecurity" . | nindent 10 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.gateway.port }}"
            - name: DATABASE_URL
              value: {{ .Values.gateway.databaseURL | quote }}
            - name: DB_PATH
              value: {{ .Values.gateway.databaseURL | quote }}
            - name: DB_MAX_OPEN_CONNS
              value: "{{ .Values.gateway.maxOpenConns }}"
            - name: DB_MAX_IDLE_CONNS
              value: "{{ .Values.gateway.maxIdleConns }}"
            - name: DB_MAX_RECORDS
              value: "{{ .Values.gateway.maxRecords }}"
          ports:
            - containerPort: {{ .Values.gateway.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/gpu-telemetry
      volumes:
        - name: data
          {{- if .Values.gateway.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-gateway
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/component: gateway
    {{- include "gpu-telemetry.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      name: http
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
{{- if .Values.gateway.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.gateway.persistence.storageClassName }}
  storageClassName: {{ .Values.gateway.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.persistence.size }}
{{- end }}
