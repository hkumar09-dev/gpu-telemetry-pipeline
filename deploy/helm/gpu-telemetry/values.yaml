replicaCount:
  broker: 1
  streamer: 2
  collector: 2
  gateway: 1

image:
  repository: gpu-telemetry
  tag: local
  pullPolicy: IfNotPresent

broker:
  port: 9000
  partitions: 8
  maxQueueSize: 10000
  ackTimeout: 30s
  retryLimit: 5
  retryBackoff: 5ms
  retryQueueSize: 1024
  metricsPort: 9091

logLevel: info

gateway:
  port: 8080
  databaseURL: /var/lib/gpu-telemetry/telemetry.json
  maxOpenConns: 4
  maxIdleConns: 2
  maxRecords: 20000
  service:
    type: ClusterIP
    nodePort:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

streamer:
  csvPath: /data/dcgm_metrics.csv
  interval: 10ms
  loop: true
  metricsPort: 9092

collector:
  metricsPort: 9093

topic: gpu-telemetry
group: collectors

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
