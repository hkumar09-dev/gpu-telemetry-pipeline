apiVersion: v1
kind: Service
metadata:
  name: gpu-streamer
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: streamer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: streamer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gpu-streamer
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: streamer
spec:
  serviceName: gpu-streamer
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-telemetry
      app.kubernetes.io/component: streamer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-telemetry
        app.kubernetes.io/component: streamer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamer
          image: gpu-telemetry/streamer:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MQ_ADDR
              value: gpu-broker:9000
            - name: MQ_TOPIC
              value: gpu-telemetry
            - name: CSV_PATH
              value: /data/dcgm_metrics.csv
            - name: STREAMER_COUNT
              value: "2"
            - name: STREAM_INTERVAL
              value: 10ms
            - name: STREAM_LOOP
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
