apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-gateway
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: gateway
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-gateway
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-telemetry
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-telemetry
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: gpu-telemetry/gateway:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DB_PATH
              value: /var/lib/gpu-telemetry/telemetry.json
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gpu-telemetry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gpu-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-gateway
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: gateway
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
      name: http
