apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-collector
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-telemetry
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-telemetry
        app.kubernetes.io/component: collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: gpu-telemetry/collector:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LOG_LEVEL
              value: info
            - name: MQ_ADDR
              value: gpu-broker:9000
            - name: MQ_TOPIC
              value: gpu-telemetry
            - name: MQ_GROUP
              value: collectors
            - name: GATEWAY_URL
              value: http://gpu-gateway:8080
            - name: CONSUMER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
