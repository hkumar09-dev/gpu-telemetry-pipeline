apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-broker
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-telemetry
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-telemetry
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: gpu-telemetry/broker:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LOG_LEVEL
              value: info
            - name: MQ_ADDR
              value: ":9000"
            - name: MQ_PARTITIONS
              value: "8"
            - name: MQ_MAX_QUEUE_SIZE
              value: "10000"
            - name: MQ_ACK_TIMEOUT
              value: "30s"
            - name: MQ_RETRY_LIMIT
              value: "5"
          ports:
            - containerPort: 9000
              name: mq
          readinessProbe:
            tcpSocket:
              port: mq
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mq
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-broker
  labels:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: broker
spec:
  selector:
    app.kubernetes.io/name: gpu-telemetry
    app.kubernetes.io/component: broker
  ports:
    - port: 9000
      targetPort: mq
      name: mq
