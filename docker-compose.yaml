services:
  broker:
    build:
      context: .
      args:
        SERVICE: broker
    environment:
      MQ_ADDR: ":9000"
    ports:
      - "9000:9000"
    networks:
      - gpu-telemetry-net
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      DB_PATH: /var/lib/gpu-telemetry/telemetry.json
    user: "0:0"
    volumes:
      - gateway-data:/var/lib/gpu-telemetry
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    depends_on:
      - broker
    networks:
      - gpu-telemetry-net
  collector:
    build:
      context: .
      args:
        SERVICE: collector
    environment:
      MQ_ADDR: broker:9000
      MQ_TOPIC: gpu-telemetry
      MQ_GROUP: collectors
      GATEWAY_URL: http://gateway:8080
    depends_on:
      broker:
        condition: service_started
      gateway:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - gpu-telemetry-net
  streamer:
    build:
      context: .
      args:
        SERVICE: streamer
    environment:
      MQ_ADDR: broker:9000
      MQ_TOPIC: gpu-telemetry
      CSV_PATH: /data/dcgm_metrics.csv
      STREAMER_INDEX: "0"
      STREAMER_COUNT: "1"
      STREAM_INTERVAL: 5ms
      STREAM_LOOP: "true"
    depends_on:
      - broker
    networks:
      - gpu-telemetry-net

networks:
  gpu-telemetry-net:
    driver: bridge

volumes:
  gateway-data:
